<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MINT promo tile</title>
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: #fcf6ed; color: #24412f;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    font-family: -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
  }
  .icon { width: 128px; height: 128px; margin: 0 -14px 0 -16px; }
  .wordmark { display: block; width: 210px; height: auto; margin: 0 0 10px -4px; }
  .tagline { font-size: 11.5px; letter-spacing: .2em; color: #3f6a52; margin: 0 0 12px; white-space: nowrap; }
  .sub { font-size: 14px; line-height: 1.35; color: #4a5a50; margin: 0; }
</style>
</head>
<body>
  <img class="icon" src="../icons/icon128.png" alt="">
  <div>
    <img class="wordmark" src="wordmark.png" alt="mint">
    <p class="tagline">MAKE IT NICE TO READ</p>
    <p class="sub">A clean, private reader view.</p>
  </div>
</body>
</html>
